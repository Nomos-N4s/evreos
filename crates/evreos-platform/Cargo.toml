# The crate the shell reaches platform services through: default-browser
# registration first (FR-013), then the secure credential store, update
# verification and local rollout evaluation (research §2.8). It holds no
# `unsafe`: every platform service is reached through a safe binding, and
# the change that adds a binding states its byte cost against budgets.toml
# under Principle II.
[package]
name = "evreos-platform"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Tier 1's registry, for default-browser registration. Microsoft's safe
# binding: its own dependencies, windows-link, windows-result and
# windows-strings, are already in this workspace's graph at these versions,
# so it adds one crate. Its byte cost is stated in the pull request that
# adds it.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(windows)'.dev-dependencies]
windows-registry = "0.6.1"

[lints]
workspace = true
