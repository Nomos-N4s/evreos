[package]
name = "evreos-i18n"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies, deliberately. FR-016a's neutral menu entry is drawn from
# these catalogues and must render at first run, with no account, no network
# and no Apivo state, so resolution is a pure function over text compiled into
# the binary. N10 is settled: the plain keyed table, adopted over
# fluent-bundle on the figures at
# specs/001-evreos-v1/measurements/n10-catalogue-format.md. A format that
# costs a dependency enters here, in the change that re-states its byte cost
# under FR-043, never quietly. The import may name this crate, so its reach
# test in crates/evreos-shell/tests/import.rs fails while this crate
# declares a normal dependency for some platforms only or links any crate,
# and lets the import name only `Language` and `catalogue` from it, with no
# path after `catalogue`; a change adding a normal dependency has to rework
# that check too.

[lints]
workspace = true
