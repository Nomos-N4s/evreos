# --- SC-005's wake enumeration. Two wakes, each bounded at the 50 ms of
# processor time SC-005 caps a wake at, because neither has been measured and
# a tighter bound would be a claim about an implementation that does not
# exist; each tightens in the change that first measures it, as a baseline is
# written by the change that first measures its entry. The period is stated
# here because SC-005 places it here: each wake is added by the change that
# states its cost, and this is that change for both. With these periods no
# 60-minute window contains more than one firing of either, so the enumerated
# bounds sum to 100 ms in any such window against the 500 ms SC-005 allows,
# leaving 400 ms for wakes later changes add.
#
# Each wake MUST be coalesced with the platform's own scheduler and MUST NOT
# wake the machine from sleep. Both are SC-005's terms, verified by design
# review and by instrumentation of scheduled work rather than by this file.
# Work a wake needs beyond its bound is a change to this file stating the
# cost, never an exception to SC-005.
#
# Not enumerated, deliberately: the FR-039a retention evaluation. FR-039a has
# the client evaluate its own retention "whenever it runs", so it is evaluated
# on every browser run and needs no timer, and an implementation with no timer
# for it enumerates none -- which SC-005 permits in terms: "none of the three
# is required to BE a scheduled wake". It is not omitted here; it is not a
# wake. Should an implementation ever give it a timer, that is a third table
# below, added by the change that states its cost.

[[wake]]
name = "update check"
period = 21600                 # seconds: every 6 hours
processor_time_bound = 50      # ms of processor time, SC-005's cap
justifying_requirement = "FR-014"
# FR-014 requires the browser to update itself and to release to a proportion
# of users at a time. The check fetches the signed manifest carrying the
# rollout fraction and decides its own inclusion locally, so the period is what
# bounds how long a hold or a widening of that fraction takes to reach every
# running install: six hours, four checks a day. The bound covers the check
# itself -- the fetch, the signature verification and the version comparison.
# Where the manifest names an update, fetching and applying it is work the
# check hands off, bounded by SC-005's window figure like everything else on
# the idle path.

[[wake]]
name = "blocking-list refresh"
period = 86400                 # seconds: every 24 hours
processor_time_bound = 50      # ms of processor time, SC-005's cap
justifying_requirement = "FR-008"
# FR-008 requires blocking active on first launch with no configuration, so
# the corpus ships in the release -- SC-001 counts its bytes -- and this wake
# is what keeps the held revision current afterwards. A revision a day keeps
# the lists current for a member who leaves the browser open all day, the
# cohort SC-004's soak is modelled on, and a shorter period buys little: a
# stale list fails soft, since the blocking that shipped still blocks, while
# every extra wake is a cost SC-005 counts. The bound covers the check for a
# newer revision than the one held. Whether a new revision can also be fetched
# and compiled inside it is unestablished -- tier 2 compiles WebKit rule lists
# of up to 150,000 rules per partition -- and where it cannot, that work is
# not this wake's: it runs off the idle path, or it is a change to this file
# stating its cost.
