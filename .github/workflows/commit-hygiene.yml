name: Commit hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    name: Authorship and attribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the pull request body to a file
        env:
          # Passed through the environment, never interpolated into a shell
          # command, so a crafted body cannot inject script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -c 'import os,pathlib; pathlib.Path("pr-body.txt").write_text(os.environ.get("PR_BODY") or "", encoding="utf-8")'

      - name: Check commits and pull request body
        run: |
          python3 scripts/check-commit-hygiene.py \
            --range "origin/${{ github.base_ref }}..HEAD" \
            --pr-body pr-body.txt
