name: Build

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # Principle III: stable Rust, no nightly features on the release path.
        # The toolchain is named here rather than left to the runner image so a
        # runner update cannot silently change what the release path builds on.
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      - name: The budget gate's own tests
        run: python3 scripts/test_check_budgets.py

      - name: Build the release artefact
        # Principle III's release path, proved to build on every change. SC-001
        # reads no figure off this binary: its download size is the installer
        # artefact CI publishes for each platform, measured on the host that
        # builds it, and this Linux runner builds none -- Linux is the deferred
        # platform, and a Linux ELF meets neither entry's condition.
        run: cargo build --release

      - name: Build the fixture brand
        # Principle VIII and FR-042: a fixture brand MUST build in CI on every
        # change, proving the brand seam rather than asserting it -- a
        # rebrandability claim CI does not exercise is discovered to be false
        # at the worst possible moment. The release profile is the one T034
        # names, but on this runner it proves only that the fixture selection
        # builds: the unset gate in crates/evreos-shell/build.rs binds on a
        # shipping platform and this runner's target is linux, the gate's
        # deliberate carve-out. brands/fixture.toml's completeness is held by
        # the the_fixture_brand_has_every_field_set unit test in the Test
        # step above, and the gate itself fires in the release-gate job
        # below, which builds the fixture where the gate is live.
        run: cargo build --release -p evreos-shell --features fixture-brand

      - name: Budgets, full report
        # Every gate, including the budget-file gate's requirement that each
        # tier's runner carry a durable identity. Informational until the
        # reference machines Q-E9a names are procured.
        continue-on-error: true
        run: python3 scripts/check-budgets.py

      - name: Budgets, blocking
        # Everything except the two deferred conditions blocks from M0: a
        # missing entry, a baseline above its stated figure, a tolerance above
        # the cap, an absolute breach on a non-hardware entry, and any
        # regression beyond an entry's declared tolerance.
        #
        # Both deferrals are stated rather than hidden, and each names what
        # satisfies it, because a deferral with no end is an exemption.
        #
        #   --allow-unpinned-runners  satisfied by procuring and pinning the two
        #     machines Q-E9a names. It is what bounds the advisory period on the
        #     hardware-dependent absolute gates.
        #
        #   --allow-unmeasured  satisfied by building the harness that produces
        #     each figure. Today that is both SC-001 quantities on both
        #     platforms: the download size, which is the installer artefact CI
        #     publishes for that platform and is measured on the host that
        #     builds it, and the installed footprint, which is the disk delta
        #     after first run completes -- each needing an installer that does
        #     not exist yet, and neither measurable on this runner, which builds
        #     no tier's artefact.
        #
        # Removing either is a release prerequisite, not a preference.
        run: >
          python3 scripts/check-budgets.py
          --allow-unpinned-runners
          --allow-unmeasured

  release-gate:
    name: Release gate on a shipping platform
    # The unset gate in crates/evreos-shell/build.rs binds only on a
    # release-profile build for a shipping platform (windows or macos -- see
    # release_gate_applies in crates/evreos-shell/src/brand/schema.rs), so
    # the build job above can never exercise its wiring: its target is
    # linux, the gate's deliberate carve-out. This job runs where the gate
    # binds and proves both of its answers on every change:
    #
    #   - the real brand, which honestly carries `unset` sentinels, REFUSES
    #     a release build -- and the step checks that the refusal is the
    #     gate's own, naming the unset fields, so an unrelated build break
    #     cannot pass as the gate firing;
    #   - the fixture brand, complete by construction, builds clean under
    #     the same gate.
    #
    # A regression that disconnects build.rs from the gate turns the first
    # build green, which the step turns red. When every field of
    # brands/evreos.toml is filled, the first step's premise ends and the
    # step changes with that edit.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # Named for the reason the build job names it: a runner update must
        # not silently change what the release path builds on.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: The unset real brand refuses a release build
        shell: bash
        run: |
          set +e
          output=$(cargo build --release -p evreos-shell 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "FAIL: the release build succeeded where the unset gate must refuse it"
            exit 1
          fi
          if ! grep -qF 'unset field(s)' <<<"$output"; then
            echo "FAIL: the release build failed, but not with the gate's unset-field refusal"
            exit 1
          fi
          echo "the gate refused the build and named the unset fields"

      - name: The complete fixture brand builds under the same gate
        run: cargo build --release -p evreos-shell --features fixture-brand

  release:
    name: Release
    # A commit on main is the only release candidate, so this job runs on the
    # push that lands one and is skipped on a pull request: a spike's pull
    # request carries its exemption for as long as the spike runs and is
    # mergeable with it. What it may not be is released.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a build carrying an unretired spike exemption
        # The Success Criteria preamble: a build produced while a spike
        # exemption is unretired MUST NOT be released or tagged, and the
        # release job refuses an artefact built from a commit whose budget file
        # records one. The file read here is the file at the commit the
        # artefact was built from, since this job and the build job check out
        # the same SHA. It refuses on every recorded exemption, well formed or
        # not; retiring one is deleting it, in the change that lands the
        # figure. While a spike is open on main this job is red, and that is
        # the statement it makes -- the commit is not releasable -- beside a
        # green build job, which is how a reader tells the two apart.
        run: python3 scripts/check-budgets.py --refuse-exemptions

      # No step publishes or tags yet. SC-001's download-size condition names
      # an installer artefact CI publishes, and no installer exists; no tag
      # scheme has been decided either. When either lands it lands in this
      # job, below the refusal, and nowhere else: a publish or tag step in
      # another job, or above the refusal in this one, is not behind it, and
      # that placement is the whole of what the refusal's guarantee rests on.
